name: Peblo TV CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint-backend:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest-cov

      - name: Run Pytest Suite
        run: |
          cd backend
          pytest -v

  test-and-build-frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build CMS
        run: |
          cd cms
          npm ci
          npm run build

      - name: Build Viewer UI
        run: |
          cd viewer
          npm ci
          npm run build

  build-docker-images:
    name: Docker Image Build & Push
    needs: [test-and-lint-backend, test-and-build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        run: |
          docker build -t peblo-api:latest ./backend

      - name: Build CMS Image
        run: |
          docker build -t peblo-cms:latest ./cms

      - name: Build Viewer Image
        run: |
          docker build -t peblo-viewer:latest ./viewer

  deploy-placeholder:
    name: Production Deployment (Placeholder)
    needs: [build-docker-images]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Kubernetes / AWS ECS
        run: |
          echo "Deploying container images to production Kubernetes cluster (Kubectl / Helm) or AWS ECS Service..."
          echo "In production, this step logs into AWS ECR, updates image tags in Helm values, and triggers rolling updates."
